name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Flutter App — Analyze, Test & Build APK
  # ==========================================
  flutter-ci:
    name: Flutter App (Analyze, Test & Build APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Android toolchain compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test --coverage

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-trace-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # Job 2: Backend API — Dependency Audit, Typecheck & Tests
  # ==========================================
  backend-api-ci:
    name: Backend API (Audit, Typecheck & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: my-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Backend API Test Suite
        run: npm test
