name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Flutter App — Analyze & Test
  # ==========================================
  flutter-ci:
    name: Flutter App (Analyze & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        # Pinned to v4.2.2 (SHA: 11bd71901bbe5b1630ceea73d27597364c9af683)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Java (Android toolchain compatibility)
        # Pinned to v4.5.0 (SHA: 3a6f49d8e914b3c2df0a45a34a3c0e09b25cad6f)
        uses: actions/setup-java@3a6f49d8e914b3c2df0a45a34a3c0e09b25cad6f
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        # Pinned to v2.16.0 (SHA: 44b7e2e3f43e62789e773b6e5e4f5b39ac35f8e8)
        uses: subosito/flutter-action@44b7e2e3f43e62789e773b6e5e4f5b39ac35f8e8
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        # CLIENT_SECRET intentionally empty for unit/widget tests — they do not
        # make real network calls, so the empty string is correct and safe here.
        run: flutter test --coverage

  # ==========================================
  # Job 2: Backend API — Dependency Audit, Typecheck & Tests
  # ==========================================
  backend-api-ci:
    name: Backend API (Audit, Typecheck & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: my-backend

    steps:
      - name: Checkout Code
        # Pinned to v4.2.2 (SHA: 11bd71901bbe5b1630ceea73d27597364c9af683)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        # Pinned to v4.1.0 (SHA: 39370e3970a6d050c480ffad4ff0ed4d3fdee5af)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # I-01 fix: Fail the build on any HIGH or CRITICAL dependency vulnerability
      - name: Audit Dependencies for Known Vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Backend API Test Suite
        # CLIENT_SECRET is set inside the test file itself to a known test-only value.
        # The production secret is NEVER passed to CI — it lives only in Vercel env vars.
        run: npm test
